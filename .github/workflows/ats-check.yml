name: ats-check

on:
  push:
    branches: [main]
    paths: ['ats-check/**', '.github/workflows/ats-check.yml']
  pull_request:
    branches: [main]
    paths: ['ats-check/**', '.github/workflows/ats-check.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: ats-check

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: python -m ats_check samples/*.pdf
