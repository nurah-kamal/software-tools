name: page-watch

on:
  schedule:
    # Once a day at 04:41 UTC (06:41 in South Africa).
    - cron: '41 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['page-watch/**', '.github/workflows/page-watch.yml']
  pull_request:
    branches: [main]
    paths: ['page-watch/**', '.github/workflows/page-watch.yml']

permissions:
  contents: read

concurrency:
  group: page-watch
  cancel-in-progress: false

jobs:
  checks:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: page-watch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Ubuntu 24.04 blocks the user namespaces Chrome's sandbox needs; allow them
      # rather than running Chrome without its sandbox.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test

  watch:
    # The only job that can write: it adds the day's snapshots and any change record.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: page-watch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm test
      - run: npm run snap
      - run: npm run diff
      - name: Commit the snapshots
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898581+github-actions[bot]@users.noreply.github.com"
          git add snapshots
          if [ -d changes ]; then git add changes; fi
          if git diff --cached --quiet; then
            echo "Nothing new today."
            exit 0
          fi
          git commit -m "page-watch: snapshots for $(TZ=Africa/Johannesburg date +%F)"
          git pull --rebase "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" main
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" HEAD:main
